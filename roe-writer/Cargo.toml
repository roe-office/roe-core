[package]
name = "roe-writer"
version = "0.1.0"
edition = "2021"

[dependencies]
roe-core   = { path = "../roe-core" }
roe-model  = { path = "../roe-model" }
cosmic-text = { workspace = true }
parley      = { workspace = true }
taffy       = { version = "0.10", default-features = false, features = ["std", "float_layout"] }
skrifa      = { workspace = true }
swash       = { workspace = true }
tiny-skia  = { workspace = true }
resvg      = { workspace = true }
thiserror  = { workspace = true }
regex      = { workspace = true }
serde      = { workspace = true }
roe-parser = { path = "../roe-parser" }
roe-impress = { path = "../roe-impress" }
roe-formula = { path = "../roe-formula" }
ratex-types = { workspace = true }
slotmap    = { workspace = true }
base64     = { workspace = true }
image      = { workspace = true }
hypher     = { version = "0.1", default-features = false, features = ["alloc", "english"] }

[[bench]]
name = "line_shape_bench"
harness = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
