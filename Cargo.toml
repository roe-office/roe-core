[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = ""
homepage = ""
documentation = ""

[workspace]
members = [
    "roe-core",
    "roe-model",
    "roe-parser",
    "roe-writer",
    "roe-calc",
    "roe-impress",
    "roe-script",
    "roe-formula",
    "roe-polars-bridge",
    "roe-bridge-lok",
    "roe-api",
    "roe-uno-compat", "roe-export", "roe-agent",
]
resolver = "2"
exclude = ["vendor/parley", "vendor/formualizer-parse"]

[workspace.dependencies]
# 序列化
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# XML 解析
quick-xml   = { version = "0.36", features = ["serialize"] }

# 压缩（KAI 格式）
csv         = "1.3"
encoding_rs = "0.8"
zstd        = "0.13"
base64      = "0.22"
image       = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# 文本 shaping + BiDi
cosmic-text = "0.19"

# Parley 迁移（vendored，见 vendor/parley/）+ 渲染管线 swash
parley = { path = "./vendor/parley/parley" }
swash  = { version = "0.2.6", default-features = false, features = ["scale", "std"] }
skrifa = { version = "0.44.0", default-features = false }

# 图形渲染
tiny-skia   = "0.12"
resvg       = { version = "0.47.0", default-features = false, features = ["text", "system-fonts"] }

# 依赖图（Calc FormulaDAG）
petgraph    = "0.6"

# 空间索引（Impress viewport culling）
rstar       = "0.12"

# 稀疏数据
smallvec    = { version = "1", features = ["serde"] }

# 正则表达式（Writer 全局查找替换 replace_text 使用；此前仅作为
# resvg/quick-xml 等的间接依赖存在于 Cargo.lock，版本不受控，
# 本次显式声明固定版本）
regex       = "1"

# 并行
rayon       = "1"

# 脚本引擎
rhai        = { version = "1", features = ["sync"] }
# 动画插值
keyframe    = "1.1.1"
easer       = "0.3.0"

# Arena / SlotMap
slotmap     = "1"

# ZIP 解压（OOXML OPC）
zip         = { version = "2", default-features = false, features = ["deflate"] }

# 图表
charts-rs   = { path = "./charts-rs", default-features = false }

# 宏工具
phf         = { version = "0.11", features = ["macros"] }

# RaTeX 内部依赖
ratex-types  = { path = "./RaTeX/crates/ratex-types" }
ratex-font   = { path = "./RaTeX/crates/ratex-font" }
ratex-lexer  = { path = "./RaTeX/crates/ratex-lexer" }
ratex-parser = { path = "./RaTeX/crates/ratex-parser" }
ratex-layout = { path = "./RaTeX/crates/ratex-layout" }

# 错误处理
thiserror   = "1"
anyhow      = "1"

# 日志
tracing     = "0.1"

# ROOT-022: formualizer-parse 的 tokenizer 按字节而非按字符处理多字节 UTF-8
# 字符（如智能引号），会导致 panic 或错误求值。formualizer-eval 内部也依赖
# formualizer-parse，用 [patch.crates-io] 让全局统一指向本地修复版，
# 避免类型不兼容（roe-calc 和 formualizer-eval 各自用不同版本的同一个 crate）。
# 见 vendor/formualizer-parse/README.md 顶部的修改说明。
# [patch.crates-io]  # 升级 formualizer 0.10:改用 crates.io 的 parse 3.1.4,vendor 暂留
# formualizer-parse = { path = "vendor/formualizer-parse" }
